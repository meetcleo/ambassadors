version: 2.1

orbs:
  ruby: circleci/ruby@2.1.1

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Which bundler?
          command: bundle -v
      - ruby/install-deps:
          app-dir: .
      - run:
          name: Sanity check Rakefile
          command: bundle exec rake -T

  test:
    docker:
      - image: cimg/ruby:3.3
    working_directory: ~/project
    steps:
      - checkout
      - ruby/install-deps:
          app-dir: .
      - run:
          name: Run tests
          command: bundle exec rake test

  lint:
    docker:
      - image: cimg/ruby:3.3
    working_directory: ~/project
    steps:
      - checkout
      - ruby/install-deps:
          app-dir: .
      - run:
          name: Run RuboCop
          command: bundle exec rubocop

workflows:
  pr_checks:
    jobs:
      - build
      - test:
          requires:
            - build
      - lint:
          requires:
            - build
